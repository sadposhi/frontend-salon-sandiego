<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Ícono que aparece en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 1. El Título Principal (Este es el que WhatsApp estaba leyendo como "catalogo-frontend") -->
    <title>El Salón D' San Diego | Tutorías Universitarias</title>
    
    <!-- 2. La Descripción Principal para Google -->
    <meta name="description" content="Asegura tu éxito universitario con nosotros. Clases especializadas con profesores de alto nivel para superar las materias de tu carrera." />

    <!-- 3. Etiquetas Open Graph para WhatsApp, Facebook e Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elsalondesandiego.vercel.app/" />
    <meta property="og:title" content="El Salón D' San Diego" />
    <meta property="og:description" content="Clases especializadas de ingeniería, arquitectura y matemáticas. ¡Inscríbete hoy!" />
    <meta property="og:image" content="https://elsalondesandiego.vercel.app/logo.png" />

    <!-- 4. Etiquetas para Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://elsalondesandiego.vercel.app/" />
    <meta name="twitter:title" content="El Salón D' San Diego" />
    <meta name="twitter:description" content="Clases especializadas con profesores universitarios de alto nivel." />
    <meta name="twitter:image" content="https://elsalondesandiego.vercel.app/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
